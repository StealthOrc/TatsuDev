<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Diabolic — Hellish Engine</title><link rel="icon" href="data:,">
<style>html,body{margin:0;width:100%;height:100%;background:#080609;color:#eadbb5;font:16px system-ui}#glcanvas{display:block;width:100%;height:100%;outline:0}#status{position:absolute;left:20px;top:16px;background:#080609dd;padding:12px;border-radius:4px;pointer-events:none}button{font:inherit;background:#342018;color:#eadbb5;border:1px solid #a3834e;padding:10px 18px;cursor:pointer}#start{position:absolute;inset:0;display:grid;place-content:center;background:#080609e8;text-align:center}</style></head>
<body><canvas id="glcanvas" tabindex="0"></canvas><div id="status">Loading Diabolic…</div><div id="start"><h1>DIABOLIC</h1><p>WASD move · Mouse look · Left click shoot · E interact · Escape pause</p><button id="enter" disabled>Loading runtime…</button></div>
<script src="miniquad_bridge.js"></script><script>
const audioContexts=[];
for(const key of ['AudioContext','webkitAudioContext']){const Original=window[key];if(Original){window[key]=function(...args){const context=new Original(...args);audioContexts.push(context);return context;};window[key].prototype=Original.prototype;}}
document.addEventListener('pointerdown',()=>audioContexts.forEach(c=>c.resume().catch(()=>{})));
let runtimeReady=false,userStarted=false,saveSyncInFlight=false;
var Module={
 noInitialRun:true,arguments:['--play','--uncapped'],canvas:document.getElementById('glcanvas'),
 locateFile(path){if(path.endsWith('.wasm'))return 'hellish-engine.wasm';if(path.endsWith('.data'))return 'hellish-engine.data';return path;},
 print(text){console.log(text);},printErr(text){console.error(text);document.getElementById('status').textContent=text;},
 onAbort(reason){document.getElementById('status').style.display='block';document.getElementById('status').textContent='Runtime failed: '+reason;},
 setStatus(text){document.getElementById('status').textContent=text||'Preparing world…';},
 instantiateWasm(imports,receive){Object.assign(imports.env||imports.a||{},HellishMiniquad.imports);
  fetch('hellish-engine.wasm').then(r=>r.arrayBuffer()).then(bytes=>WebAssembly.instantiate(bytes,imports)).then(result=>{HellishMiniquad.attach(result.instance.exports);receive(result.instance,result.module);}).catch(e=>Module.onAbort(e));return {};},
 preRun:[function(){const fs=Module.FS;fs.mkdirTree('/userdata');fs.mount(Module.IDBFS,{},'/userdata');Module.addRunDependency('hellish-save-load');fs.syncfs(true,error=>{if(error)console.warn('Save load:',error);Module.removeRunDependency('hellish-save-load');});
  Module.addRunDependency('hellish-content');fetch('runtime_files.json').then(r=>{if(!r.ok)throw Error('Runtime manifest missing');return r.json();}).then(async paths=>{
    let next=0,done=0;async function worker(){while(next<paths.length){const path=paths[next++];const response=await fetch(path);if(!response.ok)throw Error('Missing runtime asset: '+path);const bytes=new Uint8Array(await response.arrayBuffer());const absolute='/'+path;fs.mkdirTree(absolute.substring(0,absolute.lastIndexOf('/')));fs.writeFile(absolute,bytes);done++;document.getElementById('status').textContent='Loading world '+done+'/'+paths.length;}}
    await Promise.all(Array.from({length:6},worker));fs.chdir('/project/hellish');Module.removeRunDependency('hellish-content');}).catch(e=>Module.onAbort(e));}],
 onRuntimeInitialized(){runtimeReady=true;const button=document.getElementById('enter');button.disabled=false;button.textContent='Enter Hell';document.getElementById('status').textContent='Ready';},
};
document.getElementById('enter').onclick=()=>{if(!runtimeReady||userStarted)return;userStarted=true;document.getElementById('start').style.display='none';document.getElementById('status').style.display='none';document.getElementById('glcanvas').requestPointerLock();Module.callMain(Module.arguments);document.getElementById('glcanvas').focus();};
setInterval(()=>{if(runtimeReady&&Module.FS&&!saveSyncInFlight){saveSyncInFlight=true;Module.FS.syncfs(false,e=>{saveSyncInFlight=false;if(e)console.warn('Save sync:',e);});}},2000);
</script><script src="hellish-engine.js"></script></body></html>
